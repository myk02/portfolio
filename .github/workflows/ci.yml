name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # No `version` input: the action reads packageManager in package.json.
        # Passing both fails with "Multiple versions of pnpm specified".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          CI: true
