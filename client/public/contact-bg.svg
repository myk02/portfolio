<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dot-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.2" fill="#e8ff47" opacity="0.06"/>
      <circle cx="0" cy="0" r="1.2" fill="#e8ff47" opacity="0.06"/>
    </pattern>
    <pattern id="line-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#e8ff47" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#line-grid)"/>
  <rect width="100" height="100" fill="url(#dot-grid)"/>
</svg>