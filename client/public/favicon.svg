<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mike Waitindi — MW monogram. One continuous line: M's valley is W's peak,
       shared centre stem, accent chip = the "shipped" node. Dark tile keeps
       contrast on both light and dark browser tab strips. -->
  <rect width="64" height="64" fill="#0a0a0a"/>
  <g stroke="#f2ede6" stroke-width="5" stroke-linecap="square" fill="none">
    <path d="M4 50V16.4L18 34l9-11V50"/>
    <path d="M60 50V16.4L46 34l-9-11V50"/>
  </g>
  <rect x="26" y="20" width="12" height="12" fill="#e8ff47"/>
</svg>
